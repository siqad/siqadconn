language: python
dist: jammy
python:
  - "3.10"
services:
  - docker
before_install:
  - sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
  - sudo add-apt-repository -y ppa:ubuntu-sdk-team/ppa
  - sudo apt-get update
  - sudo apt-get install -y zip swig cmake ninja-build libboost-dev
  - python -m pip --disable-pip-version-check install --no-deps --upgrade "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
  - python -m pip --disable-pip-version-check install --use-deprecated=legacy-certs "certifi>=2026.10.19" scikit-build
  - python setup.py sdist -d docker-build
  - DOCKER_BUILDKIT=1 docker build --output type=local,dest=wheel-output docker-build
script:
  - mkdir -p wheelhouse
  - cp wheel-output/dist/*.whl wheelhouse/
  - zip -r wheelhouse.zip wheelhouse
deploy:
  provider: releases
  api_key:
    secure: 
  file: 'wheelhouse.zip'
  skip_cleanup: true
  draft: true
  on:
    repo: samuelngsh-testing/siqadconn
