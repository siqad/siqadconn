version: '0.2.2.{build}'

image:
  - Visual Studio 2022
environment:

  BOOST_ROOT: C:\Libraries\boost_1_87_0

  matrix:

    # For Python versions available on Appveyor, see
    # https://www.appveyor.com/docs/windows-images-software/#python
    # The list here is complete (excluding Python 2.6, which
    # isn't covered by this document) at the time of writing.

    - PYTHON: "C:\\Python310"
      DIST_N: sqconn_cp310-win32
    - PYTHON: "C:\\Python310-x64"
      DIST_N: sqconn_cp310-win_amd64
    - PYTHON: "C:\\Python311"
      DIST_N: sqconn_cp311-win32
    - PYTHON: "C:\\Python311-x64"
      DIST_N: sqconn_cp311-win_amd64

cache:
  - C:\ProgramData\chocolatey\bin -> appveyor.yml
  - C:\ProgramData\chocolatey\lib -> appveyor.yml

install:
  - C:\Python310-x64\python.exe -m venv C:\siqad-build-tools
  - 'C:\siqad-build-tools\Scripts\python.exe -m pip --disable-pip-version-check install --no-deps --upgrade "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"'
  - 'C:\siqad-build-tools\Scripts\python.exe -m pip --disable-pip-version-check install --use-deprecated=legacy-certs --only-binary=:all: "certifi>=2026.10.19" "swig>=4.2,<5" ninja'
  - set PATH=%PYTHON%;%PYTHON%\Scripts;C:\siqad-build-tools\Scripts;%PATH%
  - '"%PYTHON%\python.exe" -m pip --disable-pip-version-check install --no-deps --upgrade "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"'
  - '"%PYTHON%\python.exe" -m pip --disable-pip-version-check install --use-deprecated=legacy-certs "certifi>=2026.10.19" scikit-build'

build_script:
  #- cd %APPVEYOR_BUILD_FOLDER%/libs/siqadconn
  - cmake -S . -B build -DBUILD_TESTING=ON
  - cmake --build build --config Release
  - ctest --test-dir build -C Release --output-on-failure
    
after_build:
  #- cd %APPVEYOR_BUILD_FOLDER%/libs/siqadconn
  - "%PYTHON%\\python.exe setup.py bdist_wheel"
  - mv dist %DIST_N%

artifacts:
  - path: .\%DIST_N%

#on_success:
#  You can use this step to upload your artifacts to a public website.
#  See Appveyor's documentation for more details. Or you can simply
#  access your wheels from the Appveyor "artifacts" tab for your build.
